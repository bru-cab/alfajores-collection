<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colección de Alfajores</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍪%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .header {
            text-align: center;
            margin-bottom: 3rem;
        }
        
        .title {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }
        
        .counter {
            color: rgba(255,255,255,0.9);
            font-size: 1.2rem;
            margin-bottom: 2rem;
        }
        
        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 3rem;
        }
        
        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            outline: none;
            transition: all 0.3s ease;
        }
        
        .search-input:focus {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        
        .search-icon {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 1.2rem;
        }
        
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.2);
        }
        
        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }
        
        .card-content {
            padding: 1.5rem;
        }
        
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }
        
        .card-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.9rem;
            color: #666;
        }
        
        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .detail-icon {
            width: 16px;
            text-align: center;
        }
        
        .loading {
            text-align: center;
            color: white;
            font-size: 1.1rem;
            margin: 3rem 0;
        }
        
        .no-results {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 1.1rem;
            margin: 3rem 0;
        }
        
        .error {
            text-align: center;
            color: #ff6b6b;
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            margin: 2rem 0;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            
            .title {
                font-size: 2rem;
            }
            
            .grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }
        }

        /* Modal Styles */
        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            position: relative;
            max-width: 90vw;
            max-height: 90vh;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #999;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: #333;
            background: white;
        }

        .modal-header {
            padding: 20px;
            border-bottom: 1px solid #eee;
            background: #f8f9fa;
        }

        .modal-header h2 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 1.5rem;
        }

        .modal-image-container {
            text-align: center;
            background: #f5f5f5;
            max-height: 70vh;
            overflow: auto;
        }

        .modal-image-container img {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title">Colección de Alfajores</h1>
            <div class="counter" id="counter">Cargando colección...</div>
            
            <div class="search-container">
                <input 
                    type="text" 
                    class="search-input" 
                    id="searchInput"
                    placeholder="Busca por marca, sabor, país, color..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>
        </div>
        
        <div id="loading" class="loading">Cargando alfajores...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="noResults" class="no-results" style="display: none;">
            No se encontraron alfajores con esos criterios de búsqueda
        </div>
        
        <div class="grid" id="grid"></div>
    </div>

    <!-- Modal para mostrar imagen completa -->
    <div id="imageModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <div id="modalDetails"></div>
            </div>
            <div class="modal-image-container">
                <img id="modalImage" src="" alt="" />
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const API_BASE = window.location.protocol === 'file:' || window.location.hostname === 'localhost'
            ? 'http://localhost:3000/api'
            : 'https://alfajores-backend.onrender.com/api';
        
        let allAlfajores = [];
        let filteredAlfajores = [];
        
        // DOM Elements
        const searchInput = document.getElementById('searchInput');
        const grid = document.getElementById('grid');
        const counter = document.getElementById('counter');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const noResults = document.getElementById('noResults');
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadAlfajores();
            setupSearch();
        });
        
        async function loadAlfajores() {
            try {
                loading.style.display = 'block';
                error.style.display = 'none';
                
                allAlfajores = [];
                let currentPage = 1;
                let totalPages = 1;
                const perPage = 500; // Use max allowed per page (backend caps at 500)
                
                // Load all pages
                while (currentPage <= totalPages) {
                    const response = await fetch(`${API_BASE}/alfajores?page=${currentPage}&per_page=${perPage}`);
                    
                    if (!response.ok) {
                        throw new Error(`Error ${response.status}: ${response.statusText}`);
                    }
                    
                    const data = await response.json();
                    allAlfajores = allAlfajores.concat(data.alfajores || []);
                    totalPages = data.pages || 1;
                    
                    // Update loading message with progress
                    counter.textContent = `Cargando... ${allAlfajores.length} de ${data.total || 0} alfajores`;
                    
                    currentPage++;
                }
                
                filteredAlfajores = [...allAlfajores];
                
                updateCounter();
                renderGrid();
                
            } catch (err) {
                console.error('Error loading alfajores:', err);
                error.textContent = `Error al cargar los alfajores: ${err.message}`;
                error.style.display = 'block';
            } finally {
                loading.style.display = 'none';
            }
        }
        
        function setupSearch() {
            let searchTimeout;
            
            searchInput.addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    performSearch(e.target.value);
                }, 300); // Debounce search
            });
        }
        
        function performSearch(query) {
            if (!query.trim()) {
                filteredAlfajores = [...allAlfajores];
            } else {
                const searchTerms = query.toLowerCase().trim().split(/\s+/);
                
                filteredAlfajores = allAlfajores.filter(alfajor => {
                    // Get all searchable text for this alfajor
                    const searchableText = [
                        alfajor.marca || '',
                        alfajor.sabor || '',
                        alfajor.pais || '',
                        alfajor.color || '',
                        alfajor.notas || ''
                    ].join(' ').toLowerCase();
                    
                    // Check if ALL search terms are found somewhere in the alfajor data
                    return searchTerms.every(term => 
                        searchableText.includes(term)
                    );
                });
            }
            
            renderGrid();
        }
        
        function updateCounter() {
            const total = allAlfajores.length;
            const uniqueImages = allAlfajores.filter(a => a.image_filename).length;
            const totalWithImages = allAlfajores.filter(a => a.image_filename).length;
            counter.textContent = `${total} alfajores en la colección`;
        }
        
        function renderGrid() {
            if (filteredAlfajores.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }
            
            grid.style.display = 'grid';
            noResults.style.display = 'none';
            
            grid.innerHTML = filteredAlfajores.map(alfajor => `
                <div class="card" onclick="openModal(${JSON.stringify(alfajor).replace(/"/g, '&quot;')})">
                    ${alfajor.image_filename ? `
                        <img 
                            src="${API_BASE}/images/${alfajor.image_filename}" 
                            alt="${alfajor.marca} - ${alfajor.sabor}"
                            class="card-image"
                            loading="lazy"
                        >
                    ` : `
                        <div class="card-image" style="background: linear-gradient(45deg, #f0f0f0, #e0e0e0); display: flex; align-items: center; justify-content: center; font-size: 3rem;">
                            🍪
                        </div>
                    `}
                    
                    <div class="card-content">
                        <div class="card-title">${alfajor.marca} - ${alfajor.sabor}</div>
                        <div class="card-details">
                            <div class="detail-item">
                                <span class="detail-icon">🌍</span>
                                <span>${alfajor.pais || 'No especificado'}</span>
                            </div>
                            ${alfajor.color ? `
                                <div class="detail-item">
                                    <span class="detail-icon">🎨</span>
                                    <span>${alfajor.color}</span>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        function openModal(alfajor) {
            const modal = document.getElementById('imageModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalDetails = document.getElementById('modalDetails');
            const modalImage = document.getElementById('modalImage');
            
            // Set modal content
            modalTitle.textContent = `${alfajor.marca} - ${alfajor.sabor}`;
            modalDetails.innerHTML = `
                <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 10px;">
                    <span><strong>🌍 País:</strong> ${alfajor.pais || 'No especificado'}</span>
                    <span><strong>🎨 Color:</strong> ${alfajor.color || 'No especificado'}</span>
                    ${alfajor.notas ? `<span><strong>📝 Notas:</strong> ${alfajor.notas}</span>` : ''}
                </div>
            `;
            
            // Set image
            if (alfajor.image_filename) {
                modalImage.src = `${API_BASE}/images/${alfajor.image_filename}`;
                modalImage.alt = `${alfajor.marca} - ${alfajor.sabor}`;
            } else {
                modalImage.src = '';
                modalImage.alt = 'Sin imagen disponible';
            }
            
            // Show modal
            modal.style.display = 'flex';
        }
        
        // Setup modal close functionality
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('imageModal');
            const closeBtn = document.querySelector('.modal-close');
            
            // Close modal when clicking X
            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });
            
            // Close modal when clicking outside
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
            
            // Close modal with Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.style.display === 'flex') {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
