<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smash & Sweet</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍪%3C/text%3E%3C/svg%3E">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .title {
            color: white;
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .counter {
            color: rgba(255,255,255,0.9);
            font-size: 1.2rem;
            margin-bottom: 1.25rem;
        }

        .collection-switcher {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin: 0 auto 1.5rem;
            padding: 0.35rem;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.18);
            border-radius: 999px;
            backdrop-filter: blur(10px);
        }

        .collection-tab {
            border: none;
            background: transparent;
            color: rgba(255,255,255,0.88);
            padding: 0.7rem 1.2rem;
            border-radius: 999px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .collection-tab:hover {
            background: rgba(255,255,255,0.12);
            color: white;
        }

        .collection-tab.active {
            background: white;
            color: #4f46e5;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .search-container {
            position: relative;
            max-width: 600px;
            margin: 0 auto 1.2rem;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 50px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }

        .search-icon {
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
            font-size: 1.2rem;
        }

        .filters-row {
            display: flex;
            justify-content: center;
            gap: 0.85rem;
            flex-wrap: wrap;
            margin: 0 auto 1.5rem;
            max-width: 760px;
        }

        .burger-general-stats {
            display: none;
            grid-template-columns: repeat(4, minmax(140px, 1fr));
            gap: 0.8rem;
            max-width: 900px;
            margin: 0 auto 1.75rem;
        }

        .burger-general-stats.visible {
            display: grid;
        }

        .burger-stat-card {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 14px;
            padding: 0.75rem 0.9rem;
            backdrop-filter: blur(8px);
            text-align: left;
        }

        .burger-stat-label {
            display: block;
            color: rgba(255,255,255,0.85);
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.2rem;
        }

        .burger-stat-value {
            display: block;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .filter-control {
            display: flex;
            align-items: center;
            gap: 0.45rem;
            background: rgba(255,255,255,0.14);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 999px;
            padding: 0.4rem 0.7rem;
            backdrop-filter: blur(8px);
        }

        .filter-label {
            color: rgba(255,255,255,0.92);
            font-size: 0.86rem;
            font-weight: 600;
            padding-left: 0.2rem;
        }

        .filter-select-control {
            border: none;
            border-radius: 999px;
            padding: 0.45rem 0.75rem;
            font-size: 0.9rem;
            font-weight: 500;
            color: #111827;
            background: white;
            outline: none;
            cursor: pointer;
            min-width: 180px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .card {
            background: white;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.2);
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            display: block;
        }

        .card-image-placeholder {
            width: 100%;
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            position: relative;
        }

        .alfajor-placeholder {
            background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
        }

        .burger-placeholder {
            background: linear-gradient(135deg, #fff7ed 0%, #fdba74 100%);
            color: #9a3412;
        }

        .burger-card-media {
            width: 100%;
            height: 200px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: linear-gradient(135deg, #fff7ed 0%, #fdba74 100%);
            color: #9a3412;
        }

        .burger-card-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .burger-score-badge {
            position: absolute;
            top: 16px;
            right: 16px;
            background: #1f2937;
            color: white;
            border-radius: 999px;
            padding: 0.4rem 0.75rem;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 10px 24px rgba(0,0,0,0.18);
        }

        .place-logo-chip {
            width: 20px;
            height: 20px;
            border-radius: 999px;
            object-fit: cover;
            display: inline-block;
            vertical-align: text-bottom;
            margin-right: 0.45rem;
            border: 1px solid rgba(0,0,0,0.12);
            background: white;
        }

        .card-content {
            padding: 1.5rem;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #333;
        }

        .card-details {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            font-size: 0.9rem;
            color: #666;
        }

        .detail-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .detail-icon {
            width: 16px;
            text-align: center;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.1rem;
            margin: 3rem 0;
        }

        .no-results {
            text-align: center;
            color: rgba(255,255,255,0.8);
            font-size: 1.1rem;
            margin: 3rem 0;
        }

        .error {
            text-align: center;
            color: #ff6b6b;
            background: rgba(255,255,255,0.1);
            padding: 1rem;
            border-radius: 10px;
            margin: 2rem 0;
        }

        .modal {
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(2, 6, 23, 0.76);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-y: auto;
            padding: 20px 14px;
        }

        .modal-content {
            position: relative;
            width: min(1120px, 96vw);
            max-height: calc(100vh - 40px);
            background: #f8fafc;
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(15, 23, 42, 0.45);
            display: flex;
            flex-direction: column;
        }

        .modal-close {
            position: absolute;
            top: 14px;
            right: 14px;
            color: #334155;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            z-index: 1001;
            background: rgba(255, 255, 255, 0.72);
            border: 1px solid rgba(148, 163, 184, 0.4);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            color: #f8fafc;
            background: #0f172a;
            border-color: #0f172a;
        }

        .modal-header {
            padding: 22px 62px 18px 24px;
            border-bottom: 1px solid #e2e8f0;
            background: linear-gradient(120deg, #ffffff 0%, #f1f5f9 100%);
            flex-shrink: 0;
        }

        .modal-header h2 {
            margin: 0;
            color: #0f172a;
            font-size: 1.55rem;
            line-height: 1.2;
            letter-spacing: -0.02em;
        }

        .modal-title-with-logo {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            line-height: 1.15;
        }

        .modal-title-with-logo .place-logo-chip {
            width: 28px;
            height: 28px;
            margin: 0;
            border: 1px solid rgba(15, 23, 42, 0.18);
        }

        .place-logo-fallback {
            width: 28px;
            height: 28px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(15, 23, 42, 0.12);
            color: #0f172a;
            font-size: 0.95rem;
            line-height: 1;
            flex-shrink: 0;
        }

        .modal-body-layout {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .modal-details {
            padding: 20px 24px 24px;
            overflow-y: auto;
            display: grid;
            gap: 14px;
            align-content: start;
            background: #f8fafc;
        }

        .modal-image-container {
            padding: 18px 20px 16px;
            border-bottom: 1px solid #e2e8f0;
            background: linear-gradient(165deg, #e2e8f0 0%, #f8fafc 100%);
            min-height: 0;
            max-height: min(52vh, 560px);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-image-container img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: min(48vh, 500px);
            object-fit: contain;
            display: block;
            margin: 0;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.26);
        }

        .modal-placeholder {
            min-height: 280px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            border-radius: 14px;
        }

        .modal-placeholder.alfajor {
            background: linear-gradient(45deg, #f0f0f0, #e0e0e0);
        }

        .modal-placeholder.burger {
            background: linear-gradient(135deg, #fff7ed 0%, #fdba74 100%);
            color: #9a3412;
        }

        .modal-zoomable-image {
            cursor: zoom-in;
            touch-action: manipulation;
        }

        .fullscreen-image-modal {
            position: fixed;
            inset: 0;
            z-index: 1300;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(2, 6, 23, 0.94);
        }

        .fullscreen-image-modal img {
            width: auto;
            height: auto;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 12px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            box-shadow: 0 20px 45px rgba(15, 23, 42, 0.46);
        }

        .fullscreen-image-close {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 999px;
            background: rgba(2, 6, 23, 0.62);
            color: #f8fafc;
            font-size: 1.7rem;
            line-height: 1;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .fullscreen-image-close:hover {
            background: rgba(248, 250, 252, 0.95);
            color: #0f172a;
        }

        .modal-meta-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal-meta-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.44rem 0.72rem;
            border-radius: 999px;
            border: 1px solid #cbd5e1;
            background: #ffffff;
            color: #1e293b;
            font-size: 0.88rem;
            line-height: 1.2;
            box-shadow: 0 6px 16px rgba(148, 163, 184, 0.18);
        }

        .burger-modal-shell {
            display: grid;
            gap: 14px;
        }

        .burger-modal-summary {
            display: grid;
            grid-template-columns: minmax(120px, auto) minmax(0, 1fr);
            gap: 12px;
            align-items: stretch;
        }

        .burger-meta-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 8px;
            align-content: start;
        }

        .burger-meta-grid .modal-meta-pill {
            width: 100%;
            min-height: 42px;
            border-radius: 12px;
            padding: 0.38rem 0.5rem;
            font-size: 0.78rem;
            line-height: 1.1;
            box-shadow: 0 4px 10px rgba(148, 163, 184, 0.16);
            overflow: hidden;
        }

        .burger-meta-grid .modal-meta-pill .meta-pill-text {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .burger-score-panel {
            background: linear-gradient(145deg, #111827 0%, #1f2937 100%);
            color: #f8fafc;
            border-radius: 14px;
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            box-shadow: 0 12px 24px rgba(15, 23, 42, 0.3);
        }

        .burger-score-value {
            font-size: 2rem;
            line-height: 1;
            font-weight: 800;
        }

        .burger-score-label {
            font-size: 0.72rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(248, 250, 252, 0.82);
        }

        .burger-metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
        }

        .burger-metric-card {
            background: #ffffff;
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            padding: 10px 12px;
            box-shadow: 0 8px 20px rgba(148, 163, 184, 0.14);
        }

        .burger-metric-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 8px;
            color: #334155;
            font-size: 0.86rem;
            font-weight: 600;
        }

        .burger-metric-heading strong {
            color: #0f172a;
            font-size: 0.98rem;
            font-weight: 800;
        }

        .burger-metric-track {
            width: 100%;
            height: 7px;
            border-radius: 999px;
            overflow: hidden;
            background: #e2e8f0;
        }

        .burger-metric-track span {
            height: 100%;
            display: block;
            border-radius: inherit;
            background: linear-gradient(90deg, #f59e0b 0%, #f97316 100%);
        }

        .burger-modal-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #dbe3ef;
            border-radius: 12px;
            padding: 12px 13px;
        }

        .burger-modal-card h3 {
            margin: 0 0 0.45rem 0;
            color: #475569;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .burger-modal-card p {
            color: #1f2937;
            line-height: 1.45;
            word-break: break-word;
        }

        .burger-comments-grid {
            display: grid;
            gap: 10px;
        }

        .burger-comment-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-left: 4px solid #f97316;
            border-radius: 12px;
            padding: 12px 13px;
        }

        .burger-comment-card h4 {
            margin: 0 0 0.4rem 0;
            color: #0f172a;
            font-size: 0.94rem;
            font-weight: 700;
        }

        .burger-comment-card p {
            margin: 0;
            color: #1f2937;
            line-height: 1.45;
            word-break: break-word;
        }

        .burger-modal-place-chip {
            display: inline-flex;
            align-items: flex-start;
            gap: 0.35rem;
            font-weight: 600;
        }

        .burger-modal-place-chip .place-logo-chip {
            width: 24px;
            height: 24px;
            margin: 0;
        }

        .burger-modal-place-chip .place-logo-fallback {
            width: 24px;
            height: 24px;
            font-size: 0.8rem;
        }

        .modal-content.burger-detail-modal .modal-header {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 65%, #b45309 140%);
            border-bottom: 1px solid rgba(255, 255, 255, 0.14);
        }

        .modal-content.burger-detail-modal .modal-header h2 {
            color: #f8fafc;
        }

        .modal-content.burger-detail-modal .modal-title-with-logo .place-logo-chip {
            border-color: rgba(248, 250, 252, 0.35);
        }

        .modal-content.burger-detail-modal .modal-title-with-logo .place-logo-fallback {
            background: rgba(248, 250, 252, 0.22);
            color: #f8fafc;
        }

        .modal-content.burger-detail-modal .modal-close {
            background: rgba(15, 23, 42, 0.42);
            color: #f8fafc;
            border-color: rgba(255, 255, 255, 0.22);
        }

        .modal-content.burger-detail-modal .modal-close:hover {
            background: #ffffff;
            color: #0f172a;
        }

        .modal-content.burger-detail-modal .modal-details {
            background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
        }

        .modal-content.burger-detail-modal .modal-image-container {
            background: linear-gradient(165deg, #111827 0%, #1f2937 100%);
            border-bottom-color: rgba(148, 163, 184, 0.28);
        }

        .modal-content.burger-detail-modal .modal-image-container img {
            border-color: rgba(248, 250, 252, 0.2);
        }

        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .title {
                font-size: 2rem;
            }

            .collection-switcher {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 1rem;
            }

            .filters-row {
                flex-direction: column;
                align-items: stretch;
                max-width: 360px;
            }

            .filter-control {
                border-radius: 18px;
                padding: 0.55rem 0.65rem;
            }

            .filter-select-control {
                min-width: 0;
                width: 100%;
            }

            .burger-general-stats {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
            }

            .modal {
                padding: 10px 8px;
            }

            .modal-content {
                width: 100%;
                max-height: calc(100vh - 18px);
                border-radius: 16px;
            }

            .modal-header {
                padding: 16px 50px 14px 16px;
            }

            .modal-header h2 {
                font-size: 1.25rem;
            }

            .modal-details {
                padding: 14px 16px 16px;
            }

            .modal-image-container {
                max-height: 42vh;
                padding: 14px;
                overflow: hidden;
            }

            .modal-image-container img {
                max-height: 40vh;
            }

            .burger-modal-summary {
                grid-template-columns: 1fr;
            }

            .burger-score-panel {
                align-items: center;
                text-align: center;
            }

            .burger-metrics-grid {
                grid-template-columns: repeat(2, minmax(120px, 1fr));
            }

            .burger-meta-grid .modal-meta-pill {
                font-size: 0.74rem;
                min-height: 40px;
                padding: 0.34rem 0.44rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 class="title" id="pageTitle">Smash & Sweet</h1>
            <div class="counter" id="counter">Cargando colección...</div>

            <div class="collection-switcher" role="tablist" aria-label="Colecciones">
                <button class="collection-tab" data-collection="alfajores" role="tab" aria-selected="false">Alfajores</button>
                <button class="collection-tab active" data-collection="burgers" role="tab" aria-selected="true">Burgers</button>
            </div>

            <div class="search-container">
                <input
                    type="text"
                    class="search-input"
                    id="searchInput"
                    placeholder="Busca por marca, sabor, país, color..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>

            <div class="filters-row" aria-label="Filtros">
                <div class="filter-control">
                    <span class="filter-label">Fecha</span>
                    <select id="dateFilter" class="filter-select-control">
                        <option value="all">Todas</option>
                        <option value="today">Hoy</option>
                        <option value="last:7">Últimos 7 días</option>
                        <option value="last:30">Últimos 30 días</option>
                        <option value="last:90">Últimos 90 días</option>
                        <option value="this_year">Este año</option>
                    </select>
                </div>
                <div class="filter-control">
                    <span class="filter-label" id="ratingFilterLabel">Puntaje</span>
                    <select id="ratingFilter" class="filter-select-control">
                        <option value="all">Todos</option>
                    </select>
                </div>
            </div>

            <div id="burgerGeneralStats" class="burger-general-stats"></div>
        </div>

        <div id="loading" class="loading">Cargando burgers...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="noResults" class="no-results" style="display: none;">
            No se encontraron burgers con esos criterios de búsqueda
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <div id="imageModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="modal-close">&times;</span>
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
            </div>
            <div class="modal-body-layout">
                <div class="modal-image-container" id="modalMedia"></div>
                <div id="modalDetails" class="modal-details"></div>
            </div>
        </div>
    </div>

    <div id="fullscreenImageModal" class="fullscreen-image-modal" style="display: none;" aria-hidden="true">
        <button type="button" class="fullscreen-image-close" aria-label="Cerrar imagen">&times;</button>
        <img id="fullscreenImageModalImg" src="" alt="">
    </div>

    <script>
        const API_BASE = window.location.protocol === 'file:' || window.location.hostname === 'localhost'
            ? 'http://localhost:3000/api'
            : `${window.location.origin}/api`;

        const collectionConfig = {
            alfajores: {
                title: 'Smash & Sweet · Alfajores',
                loading: 'Cargando alfajores...',
                empty: 'No se encontraron alfajores con esos criterios de búsqueda',
                placeholder: 'Busca por marca, sabor, país, color...',
                counterText: items => `${items.length} alfajores en Smash & Sweet`,
                searchFields: ['marca', 'sabor', 'pais', 'color', 'notas'],
                ratingFilterLabel: 'Puntaje',
                ratingFilterOptions: [
                    { value: 'all', label: 'Todos los puntajes' },
                    { value: 'rated', label: 'Con puntaje' },
                    { value: 'min:4', label: '4.0+ / 5' },
                    { value: 'min:3', label: '3.0+ / 5' },
                    { value: 'min:2', label: '2.0+ / 5' }
                ]
            },
            burgers: {
                title: 'Smash & Sweet · Burgers',
                loading: 'Cargando burgers...',
                empty: 'No se encontraron burgers con esos criterios de búsqueda',
                placeholder: 'Busca por nombre, local, carne, pan, toppings...',
                counterText: items => {
                    if (items.length === 0) return '0 burgers en Smash & Sweet';
                    const average = items.reduce((sum, item) => sum + Number(item.overallScore || 0), 0) / items.length;
                    return `${items.length} burgers en Smash & Sweet · promedio ${formatBurgerOverallScore(average)}/10`;
                },
                searchFields: ['name', 'place', 'location', 'meatStyle', 'bunStyle', 'toppings', 'size', 'notes'],
                ratingFilterLabel: 'Score',
                ratingFilterOptions: [
                    { value: 'all', label: 'Todos los scores' },
                    { value: 'rated', label: 'Con score' },
                    { value: 'min:9', label: '9.0+ / 10' },
                    { value: 'min:8', label: '8.0+ / 10' },
                    { value: 'min:7', label: '7.0+ / 10' }
                ]
            }
        };

        let activeCollection = 'burgers';
        let allCollections = {
            alfajores: [],
            burgers: []
        };
        let filteredCollections = {
            alfajores: [],
            burgers: []
        };
        let activeFilters = {
            alfajores: { date: 'all', rating: 'all' },
            burgers: { date: 'all', rating: 'all' }
        };

        const pageTitle = document.getElementById('pageTitle');
        const searchInput = document.getElementById('searchInput');
        const dateFilter = document.getElementById('dateFilter');
        const ratingFilter = document.getElementById('ratingFilter');
        const ratingFilterLabel = document.getElementById('ratingFilterLabel');
        const grid = document.getElementById('grid');
        const counter = document.getElementById('counter');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const noResults = document.getElementById('noResults');
        const burgerGeneralStats = document.getElementById('burgerGeneralStats');
        const collectionTabs = document.querySelectorAll('.collection-tab');
        let previousBodyOverflow = '';

        document.addEventListener('DOMContentLoaded', () => {
            setupCollectionSwitch();
            setupSearch();
            setupFilters();
            setupModal();
            setupFullscreenImageModal();
            updateCollectionUI();
            loadBurgers();
            loadAlfajores();
        });

        async function loadAlfajores() {
            try {
                if (activeCollection === 'alfajores') {
                    loading.textContent = collectionConfig.alfajores.loading;
                    loading.style.display = 'block';
                }

                error.style.display = 'none';

                const response = await fetch(`${API_BASE}/alfajores?per_page=1000&sort=page_desc`);
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                allCollections.alfajores = data.alfajores || [];
                filteredCollections.alfajores = [...allCollections.alfajores];

                if (activeCollection === 'alfajores') {
                    updateCounter();
                    renderGrid();
                }
            } catch (err) {
                console.error('Error loading alfajores:', err);
                if (activeCollection === 'alfajores') {
                    error.textContent = `Error al cargar los alfajores: ${err.message}`;
                    error.style.display = 'block';
                }
            } finally {
                if (activeCollection === 'alfajores') {
                    loading.style.display = 'none';
                }
            }
        }

        function parseBurgerTimestamp(rawValue) {
            if (typeof rawValue === 'number') {
                return Number.isFinite(rawValue) ? rawValue : 0;
            }

            if (typeof rawValue !== 'string') {
                return 0;
            }

            const trimmed = rawValue.trim();
            if (!trimmed) {
                return 0;
            }

            // Backend values without timezone are UTC; make that explicit for stable comparisons.
            const normalized = /([zZ]|[+-]\d{2}:\d{2})$/.test(trimmed) ? trimmed : `${trimmed}Z`;
            const parsed = new Date(normalized).getTime();
            if (Number.isFinite(parsed)) {
                return parsed;
            }

            const fallback = new Date(trimmed).getTime();
            return Number.isFinite(fallback) ? fallback : 0;
        }

        function getBurgerUpdatedTimestamp(burger) {
            return parseBurgerTimestamp(burger?.dateModified || burger?.dateAdded || 0);
        }

        function getBurgerAddedTimestamp(burger) {
            return parseBurgerTimestamp(burger?.dateAdded || burger?.dateModified || 0);
        }

        function roundBurgerOverallScore(score) {
            const parsed = Number(score);
            if (!Number.isFinite(parsed)) return 0;

            const rounded = Math.floor((parsed * 10) + 0.5) / 10;
            return Number.isFinite(rounded) ? Number(rounded.toFixed(1)) : 0;
        }

        function formatBurgerOverallScore(score) {
            return roundBurgerOverallScore(score).toFixed(1);
        }

        const BURGER_RATING_FIELDS = [
            { key: 'meat', label: 'Carne', min: 1, max: 5, scaleLabel: 5 },
            { key: 'bun', label: 'Pan', min: 1, max: 5, scaleLabel: 5 },
            { key: 'toppings', label: 'Toppings', min: 1, max: 5, scaleLabel: 5 },
            { key: 'temperature', label: 'Temperatura', min: 0, max: 1, scaleLabel: 1 },
            { key: 'size', label: 'Tamaño', min: 0, max: 2, scaleLabel: 2 }
        ];
        const BURGER_RATING_ALIASES = {
            meat: ['meat', 'carne'],
            bun: ['bun', 'pan'],
            toppings: ['toppings', 'extras', 'extra', 'topings'],
            temperature: ['temperature', 'temp', 'temperatura'],
            size: ['size', 'tamano', 'tamaño']
        };
        const DEFAULT_BURGER_PLACE_IMAGES = {
            smashico: '/api/images/smashico.jpg',
            fastgood: '/api/images/fastgood.jpg',
            'burger time': '/api/images/burgertime.jpg',
            burgertime: '/api/images/burgertime.jpg',
            'billy burgers': '/api/images/billy.jpg',
            billy: '/api/images/billy.jpg',
            'el encantador de burgas': '/api/images/elencantadordeburgas.jpg',
            'encantador de burgas': '/api/images/elencantadordeburgas.jpg',
            elencantadordeburgas: '/api/images/elencantadordeburgas.jpg'
        };

        function getDefaultBurgerImageForPlace(place) {
            const normalizedPlace = String(place || '').trim().toLowerCase();
            if (!normalizedPlace) return null;

            for (const [key, imageUrl] of Object.entries(DEFAULT_BURGER_PLACE_IMAGES)) {
                if (normalizedPlace.includes(key)) {
                    return { id: `default_${key}`, dataUrl: imageUrl, name: `Logo ${key}` };
                }
            }

            return null;
        }

        function getBurgerPlaceLogoSrc(place) {
            const logo = getDefaultBurgerImageForPlace(place);
            if (!logo) return null;

            const src = typeof logo === 'string'
                ? logo
                : (logo.dataUrl || logo.url || '');

            return typeof src === 'string' && src.trim() ? src.trim() : null;
        }

        function renderBurgerPlaceLogoChip(place) {
            const logoSrc = getBurgerPlaceLogoSrc(place);
            if (!logoSrc) return '';
            const safePlace = escapeHtml(place || 'local');
            return `<img src="${escapeHtml(logoSrc)}" alt="Logo ${safePlace}" class="place-logo-chip" loading="lazy" onerror="this.style.display='none'; const fallback = this.nextElementSibling; if (fallback) fallback.style.display='inline-flex';"><span class="place-logo-fallback" style="display:none;" aria-hidden="true">🏪</span>`;
        }

        function renderBurgerPlaceLogoWithFallback(place) {
            const logoMarkup = renderBurgerPlaceLogoChip(place);
            if (logoMarkup) {
                return logoMarkup;
            }
            return '<span class="place-logo-fallback" aria-hidden="true">🏪</span>';
        }

        function hasBurgerImageData(burger) {
            if (!burger || typeof burger !== 'object') {
                return false;
            }

            if (typeof burger.image === 'string' && burger.image.trim()) {
                return true;
            }

            if (typeof burger.image_url === 'string' && burger.image_url.trim()) {
                return true;
            }

            if (!Array.isArray(burger.images)) {
                return false;
            }

            return burger.images.some(image => {
                if (typeof image === 'string') {
                    return image.trim().length > 0;
                }

                if (!image || typeof image !== 'object') {
                    return false;
                }

                if (typeof image.dataUrl === 'string' && image.dataUrl.trim()) {
                    return true;
                }

                if (typeof image.url === 'string' && image.url.trim()) {
                    return true;
                }

                return false;
            });
        }

        function hasBurgerRatingsData(burger) {
            if (!burger || typeof burger !== 'object' || typeof burger.ratings !== 'object' || burger.ratings === null) {
                return false;
            }

            return BURGER_RATING_FIELDS.some(field => {
                const aliases = BURGER_RATING_ALIASES[field.key] || [field.key];
                return aliases.some(alias => {
                    const value = Number(burger.ratings?.[alias]);
                    return Number.isFinite(value) && value >= field.min && value <= field.max;
                });
            });
        }

        function hasBurgerCommentsData(burger) {
            if (!burger || typeof burger !== 'object' || typeof burger.ratingComments !== 'object' || burger.ratingComments === null) {
                return false;
            }

            return BURGER_RATING_FIELDS.some(field => {
                const aliases = BURGER_RATING_ALIASES[field.key] || [field.key];
                return aliases.some(alias => {
                    const value = burger.ratingComments?.[alias];
                    return typeof value === 'string' && value.trim().length > 0;
                });
            });
        }

        function getBurgerRatingValue(burger, key) {
            const field = BURGER_RATING_FIELDS.find(item => item.key === key);
            if (!field) return null;
            const aliases = BURGER_RATING_ALIASES[key] || [key];
            for (const alias of aliases) {
                const parsed = Number(burger?.ratings?.[alias]);
                if (Number.isFinite(parsed) && parsed >= field.min && parsed <= field.max) {
                    return parsed;
                }
            }

            return null;
        }

        function getBurgerRatingComment(burger, key) {
            const aliases = BURGER_RATING_ALIASES[key] || [key];
            for (const alias of aliases) {
                const value = burger?.ratingComments?.[alias];
                if (typeof value === 'string' && value.trim()) {
                    return value.trim();
                }
            }
            return '';
        }

        function formatBurgerMetricValue(value) {
            if (!Number.isFinite(value)) return '-';
            return Number.isInteger(value) ? String(value) : value.toFixed(1);
        }

        function getBurgerMetricProgress(value, field) {
            if (!Number.isFinite(value) || !field || field.max === field.min) return 0;
            const normalized = (value - field.min) / (field.max - field.min);
            const clamped = Math.max(0, Math.min(1, normalized));
            return Math.round(clamped * 100);
        }

        function mergeBurgerRecordVersions(preferred, fallback) {
            const merged = { ...preferred };

            if (!hasBurgerImageData(merged) && hasBurgerImageData(fallback)) {
                if (Array.isArray(fallback.images) && fallback.images.length > 0) {
                    merged.images = fallback.images;
                    merged.coverImageId = fallback.coverImageId || merged.coverImageId || null;
                }

                if (typeof fallback.image === 'string' && fallback.image.trim()) {
                    merged.image = fallback.image;
                }

                if (typeof fallback.image_url === 'string' && fallback.image_url.trim()) {
                    merged.image_url = fallback.image_url;
                }
            }

            if (!hasBurgerRatingsData(merged) && hasBurgerRatingsData(fallback)) {
                merged.ratings = { ...fallback.ratings };
            } else if (hasBurgerRatingsData(merged) && hasBurgerRatingsData(fallback)) {
                merged.ratings = { ...(fallback.ratings || {}), ...(merged.ratings || {}) };
            }

            if (!hasBurgerCommentsData(merged) && hasBurgerCommentsData(fallback)) {
                merged.ratingComments = { ...fallback.ratingComments };
            } else if (hasBurgerCommentsData(merged) && hasBurgerCommentsData(fallback)) {
                merged.ratingComments = { ...(fallback.ratingComments || {}), ...(merged.ratingComments || {}) };
            }

            ['location', 'meatStyle', 'bunStyle', 'toppings', 'size', 'notes'].forEach(field => {
                const preferredValue = typeof merged[field] === 'string' ? merged[field].trim() : '';
                const fallbackValue = typeof fallback?.[field] === 'string' ? fallback[field].trim() : '';
                if (!preferredValue && fallbackValue) {
                    merged[field] = fallbackValue;
                }
            });

            return merged;
        }

        function pickPreferredBurgerRecord(first, second) {
            const firstTimestamp = getBurgerUpdatedTimestamp(first);
            const secondTimestamp = getBurgerUpdatedTimestamp(second);

            if (firstTimestamp > secondTimestamp) {
                return mergeBurgerRecordVersions(first, second);
            }

            if (secondTimestamp > firstTimestamp) {
                return mergeBurgerRecordVersions(second, first);
            }

            const firstHasImages = hasBurgerImageData(first);
            const secondHasImages = hasBurgerImageData(second);

            if (firstHasImages && !secondHasImages) {
                return mergeBurgerRecordVersions(first, second);
            }

            if (secondHasImages && !firstHasImages) {
                return mergeBurgerRecordVersions(second, first);
            }

            return mergeBurgerRecordVersions(first, second);
        }

        function sortBurgers(items) {
            return [...items].sort((a, b) => {
                const dateDiff = getBurgerAddedTimestamp(b) - getBurgerAddedTimestamp(a);
                if (dateDiff !== 0) return dateDiff;
                const scoreDiff = Number(b.overallScore || 0) - Number(a.overallScore || 0);
                if (scoreDiff !== 0) return scoreDiff;
                return String(a.id || '').localeCompare(String(b.id || ''));
            });
        }

        function readBurgersFromLocalStorage() {
            try {
                const storedBurgers = JSON.parse(localStorage.getItem('burgersData') || '{}');
                if (Array.isArray(storedBurgers)) {
                    return storedBurgers.filter(item => item && typeof item === 'object');
                }
                if (storedBurgers && typeof storedBurgers === 'object') {
                    return Object.values(storedBurgers).filter(item => item && typeof item === 'object');
                }
                return [];
            } catch (error) {
                console.error('Error reading burgers from localStorage:', error);
                return [];
            }
        }

        function mergeBurgerLists(localBurgers, remoteBurgers) {
            const map = {};

            remoteBurgers.forEach(item => {
                if (!item?.id) return;
                map[item.id] = item;
            });

            localBurgers.forEach(item => {
                if (!item?.id) return;
                const existing = map[item.id];
                if (!existing) {
                    map[item.id] = item;
                    return;
                }

                map[item.id] = pickPreferredBurgerRecord(item, existing);
            });

            return Object.values(map);
        }

        async function loadBurgers() {
            const localBurgers = readBurgersFromLocalStorage();
            let mergedBurgers = [...localBurgers];

            if (activeCollection === 'burgers') {
                loading.textContent = collectionConfig.burgers.loading;
                loading.style.display = 'block';
            }
            error.style.display = 'none';

            try {
                const response = await fetch(`${API_BASE}/burgers`);
                if (response.ok) {
                    const payload = await response.json();
                    const remoteBurgers = Array.isArray(payload?.burgers)
                        ? payload.burgers.filter(item => item && typeof item === 'object')
                        : [];
                    mergedBurgers = mergeBurgerLists(localBurgers, remoteBurgers);
                } else if (activeCollection === 'burgers') {
                    error.textContent = `Error al cargar las burgers: HTTP ${response.status}`;
                    error.style.display = 'block';
                }
            } catch (err) {
                console.error('Error loading burgers from backend:', err);
                if (activeCollection === 'burgers') {
                    const message = err instanceof Error ? err.message : 'No se pudo conectar al servidor.';
                    error.textContent = `Error al cargar las burgers: ${message}`;
                    error.style.display = 'block';
                }
            } finally {
                if (activeCollection === 'burgers') {
                    loading.style.display = 'none';
                }
            }

            const burgers = sortBurgers(mergedBurgers);
            allCollections.burgers = burgers;
            filteredCollections.burgers = [...burgers];

            if (activeCollection === 'burgers') {
                updateCounter();
                renderBurgerGeneralStats();
                renderGrid();
            }
        }

        function setupCollectionSwitch() {
            collectionTabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    switchCollection(tab.dataset.collection);
                });
            });

            window.addEventListener('storage', event => {
                if (event.key === 'burgersData') {
                    loadBurgers().then(() => {
                        if (activeCollection === 'burgers') {
                            performSearch(searchInput.value);
                        }
                    });
                }
            });
        }

        function switchCollection(collection) {
            if (collection === activeCollection) return;

            activeCollection = collection;
            searchInput.value = '';
            error.style.display = 'none';
            loading.style.display = 'none';

            collectionTabs.forEach(tab => {
                const isActive = tab.dataset.collection === collection;
                tab.classList.toggle('active', isActive);
                tab.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });

            if (collection === 'burgers') {
                loadBurgers();
            }

            updateCollectionUI();
            performSearch('');
        }

        function updateCollectionUI() {
            const config = collectionConfig[activeCollection];
            pageTitle.textContent = config.title;
            searchInput.placeholder = config.placeholder;
            loading.textContent = config.loading;
            noResults.textContent = config.empty;
            updateFilterControlsUI();
            updateCounter();
            renderBurgerGeneralStats();
        }

        function setupFilters() {
            dateFilter.addEventListener('change', event => {
                activeFilters[activeCollection].date = event.target.value;
                performSearch(searchInput.value);
            });

            ratingFilter.addEventListener('change', event => {
                activeFilters[activeCollection].rating = event.target.value;
                performSearch(searchInput.value);
            });
        }

        function updateFilterControlsUI() {
            const config = collectionConfig[activeCollection];
            const filters = activeFilters[activeCollection];
            const ratingOptions = config.ratingFilterOptions || [];

            ratingFilterLabel.textContent = config.ratingFilterLabel || 'Rating';
            ratingFilter.innerHTML = ratingOptions
                .map(option => `<option value="${option.value}">${option.label}</option>`)
                .join('');

            const availableValues = new Set(ratingOptions.map(option => option.value));
            if (!availableValues.has(filters.rating)) {
                filters.rating = 'all';
            }

            dateFilter.value = filters.date || 'all';
            ratingFilter.value = filters.rating;
        }

        function getCollectionRating(item) {
            const raw = activeCollection === 'burgers'
                ? (item.overallScore ?? item.rating_overall ?? item.ratingOverall)
                : (item.rating_overall ?? item.ratingOverall);
            const parsed = Number(raw);
            return Number.isFinite(parsed) ? parsed : null;
        }

        function passesDateFilter(item, dateFilterValue) {
            if (!dateFilterValue || dateFilterValue === 'all') {
                return true;
            }

            const addedDate = getItemAddedDate(item);
            if (!addedDate) {
                return false;
            }

            const parsedDate = new Date(addedDate);
            if (Number.isNaN(parsedDate.getTime())) {
                return false;
            }

            const now = new Date();

            if (dateFilterValue === 'today') {
                return parsedDate.toDateString() === now.toDateString();
            }

            if (dateFilterValue === 'this_year') {
                return parsedDate.getFullYear() === now.getFullYear();
            }

            if (dateFilterValue.startsWith('last:')) {
                const days = Number(dateFilterValue.split(':')[1]);
                if (!Number.isFinite(days) || days <= 0) {
                    return true;
                }

                const elapsedMs = now.getTime() - parsedDate.getTime();
                const rangeMs = days * 24 * 60 * 60 * 1000;
                return elapsedMs >= 0 && elapsedMs <= rangeMs;
            }

            return true;
        }

        function passesRatingFilter(item, ratingFilterValue) {
            if (!ratingFilterValue || ratingFilterValue === 'all') {
                return true;
            }

            const rating = getCollectionRating(item);

            if (ratingFilterValue === 'rated') {
                return rating !== null;
            }

            if (ratingFilterValue.startsWith('min:')) {
                const threshold = Number(ratingFilterValue.split(':')[1]);
                if (!Number.isFinite(threshold)) {
                    return true;
                }
                return rating !== null && rating >= threshold;
            }

            return true;
        }

        function setupSearch() {
            let searchTimeout;

            searchInput.addEventListener('input', event => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    performSearch(event.target.value);
                }, 300);
            });
        }

        function performSearch(query) {
            const items = allCollections[activeCollection];
            const searchFields = collectionConfig[activeCollection].searchFields;
            const { date, rating } = activeFilters[activeCollection];
            let baseMatches = [];

            if (!query.trim()) {
                baseMatches = [...items];
            } else {
                const searchTerms = query.toLowerCase().trim().split(/\s+/);

                baseMatches = items.filter(item => {
                    const searchableText = searchFields
                        .map(field => item[field] || '')
                        .join(' ')
                        .toLowerCase();

                    return searchTerms.every(term => searchableText.includes(term));
                });
            }

            filteredCollections[activeCollection] = baseMatches.filter(item => (
                passesDateFilter(item, date) && passesRatingFilter(item, rating)
            ));

            renderBurgerGeneralStats();
            renderGrid();
        }

        function updateCounter() {
            const items = allCollections[activeCollection];
            counter.textContent = collectionConfig[activeCollection].counterText(items);
        }

        function renderBurgerGeneralStats() {
            if (!burgerGeneralStats) return;

            if (activeCollection !== 'burgers') {
                burgerGeneralStats.classList.remove('visible');
                burgerGeneralStats.innerHTML = '';
                return;
            }

            const burgers = Array.isArray(allCollections.burgers) ? allCollections.burgers : [];
            const total = burgers.length;
            const average = total
                ? burgers.reduce((sum, burger) => sum + Number(burger.overallScore || 0), 0) / total
                : 0;
            const placeInsights = getBurgerPlaceInsights(burgers);

            burgerGeneralStats.innerHTML = `
                <div class="burger-stat-card">
                    <span class="burger-stat-label">Reseñas</span>
                    <span class="burger-stat-value">${total}</span>
                </div>
                <div class="burger-stat-card">
                    <span class="burger-stat-label">Promedio</span>
                    <span class="burger-stat-value">${formatBurgerOverallScore(average)} / 10</span>
                </div>
                <div class="burger-stat-card">
                    <span class="burger-stat-label">Local mejor puntaje</span>
                    <span class="burger-stat-value">${escapeHtml(placeInsights.bestByAverageLabel)}</span>
                </div>
                <div class="burger-stat-card">
                    <span class="burger-stat-label">Pediste más en</span>
                    <span class="burger-stat-value">${escapeHtml(placeInsights.mostOrderedLabel)}</span>
                </div>
            `;
            burgerGeneralStats.classList.add('visible');
        }

        function getBurgerPlaceInsights(burgers) {
            const placeAccumulator = {};

            burgers.forEach(burger => {
                const place = String(burger?.place || '').trim();
                if (!place) return;

                const score = Number(burger?.overallScore);
                if (!Number.isFinite(score)) return;

                if (!placeAccumulator[place]) {
                    placeAccumulator[place] = { count: 0, scoreSum: 0 };
                }

                placeAccumulator[place].count += 1;
                placeAccumulator[place].scoreSum += score;
            });

            const entries = Object.entries(placeAccumulator).map(([place, values]) => ({
                place,
                count: values.count,
                average: values.count > 0 ? values.scoreSum / values.count : 0
            }));

            if (entries.length === 0) {
                return {
                    bestByAverageLabel: 'Sin datos',
                    mostOrderedLabel: 'Sin datos'
                };
            }

            const bestByAverage = [...entries].sort((a, b) => {
                if (b.average !== a.average) return b.average - a.average;
                if (b.count !== a.count) return b.count - a.count;
                return a.place.localeCompare(b.place);
            })[0];

            const mostOrdered = [...entries].sort((a, b) => {
                if (b.count !== a.count) return b.count - a.count;
                if (b.average !== a.average) return b.average - a.average;
                return a.place.localeCompare(b.place);
            })[0];

            return {
                bestByAverageLabel: `${bestByAverage.place} (${formatBurgerOverallScore(bestByAverage.average)})`,
                mostOrderedLabel: `${mostOrdered.place} (${mostOrdered.count})`
            };
        }

        function escapeHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatAddedDate(rawDate) {
            if (!rawDate) return null;

            const parsedDate = new Date(rawDate);
            if (Number.isNaN(parsedDate.getTime())) {
                return null;
            }

            const month = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'][parsedDate.getMonth()];
            const day = parsedDate.getDate();
            const year = parsedDate.getFullYear();
            return `${day} ${month} ${year}`;
        }

        function getItemAddedDate(item) {
            return item?.date_added || item?.dateAdded || null;
        }

        function renderAddedDateDetail(item) {
            const formattedDate = formatAddedDate(getItemAddedDate(item));
            if (!formattedDate) {
                return '';
            }

            return `
                <div class="detail-item">
                    <span class="detail-icon">📅</span>
                    <span>${formattedDate}</span>
                </div>
            `;
        }

        function renderAddedDateModal(item) {
            const formattedDate = formatAddedDate(getItemAddedDate(item));
            if (!formattedDate) {
                return '';
            }

            return `<span><strong>📅 Agregado:</strong> ${formattedDate}</span>`;
        }

        function resolveAlfajorImageSrc(alfajor) {
            const imageUrl = (alfajor.image_url || '').trim();
            if (imageUrl) {
                return imageUrl;
            }

            const imageFilename = (alfajor.image_filename || '').trim();
            if (!imageFilename) {
                return null;
            }

            if (/^(https?:|data:|blob:)/i.test(imageFilename)) {
                return imageFilename;
            }

            return `${API_BASE}/images/${encodeURIComponent(imageFilename)}`;
        }

        function resolveImageFallbackUrl(currentSrc) {
            try {
                const parsedUrl = new URL(currentSrc, window.location.href);
                const filename = parsedUrl.pathname.split('/').pop() || '';

                if (filename.endsWith('.png') && filename.startsWith('page_')) {
                    const pageStem = filename.slice(0, -4);
                    parsedUrl.pathname = parsedUrl.pathname.replace(/[^/]+$/, `${pageStem}_1.jpg`);
                    return parsedUrl.toString();
                }
            } catch (error) {
                console.debug('Could not build image fallback URL', error);
            }

            return null;
        }

        function handleAlfajorCardImageError(imageEl) {
            if (!imageEl) return;

            if (!imageEl.dataset.fallbackTried) {
                const fallbackUrl = resolveImageFallbackUrl(imageEl.src);
                if (fallbackUrl && fallbackUrl !== imageEl.src) {
                    imageEl.dataset.fallbackTried = 'true';
                    imageEl.src = fallbackUrl;
                    return;
                }
            }

            imageEl.outerHTML = '<div class="card-image-placeholder alfajor-placeholder">🍪</div>';
        }

        function handleAlfajorModalImageError(imageEl) {
            if (!imageEl) return;

            if (!imageEl.dataset.fallbackTried) {
                const fallbackUrl = resolveImageFallbackUrl(imageEl.src);
                if (fallbackUrl && fallbackUrl !== imageEl.src) {
                    imageEl.dataset.fallbackTried = 'true';
                    imageEl.src = fallbackUrl;
                    return;
                }
            }

            const modalMedia = document.getElementById('modalMedia');
            if (modalMedia) {
                modalMedia.innerHTML = '<div class="modal-placeholder alfajor">🍪</div>';
            }
        }

        function renderAlfajorCardMedia(alfajor) {
            const imageSrc = resolveAlfajorImageSrc(alfajor);
            if (!imageSrc) {
                return '<div class="card-image-placeholder alfajor-placeholder">🍪</div>';
            }

            const imageAlt = escapeHtml(`${alfajor.marca || 'Alfajor'} - ${alfajor.sabor || ''}`.trim());

            return `
                <img
                    src="${escapeHtml(imageSrc)}"
                    alt="${imageAlt}"
                    class="card-image"
                    loading="lazy"
                    onerror="handleAlfajorCardImageError(this)"
                >
            `;
        }

        function getBurgerCoverImage(burger) {
            const images = Array.isArray(burger?.images) ? burger.images : [];
            if (images.length > 0) {
                const selected = images.find(image => image && image.id === burger?.coverImageId) || images[0];
                if (selected && typeof selected === 'object') {
                    return selected;
                }
                if (typeof selected === 'string') {
                    return { dataUrl: selected };
                }
            }

            if (typeof burger?.image === 'string' && burger.image.trim()) {
                return { dataUrl: burger.image.trim() };
            }

            if (typeof burger?.image_url === 'string' && burger.image_url.trim()) {
                return { dataUrl: burger.image_url.trim() };
            }

            return getDefaultBurgerImageForPlace(burger?.place);
        }

        function resolveBurgerImageSrc(burger) {
            const coverImage = getBurgerCoverImage(burger);
            if (!coverImage) return null;

            const candidate = typeof coverImage === 'string'
                ? coverImage
                : (coverImage.dataUrl || coverImage.url || '');

            if (!candidate || typeof candidate !== 'string') {
                return null;
            }

            return candidate.trim() || null;
        }

        function handleBurgerCardImageError(imageEl) {
            if (!imageEl) return;

            const media = imageEl.closest('.burger-card-media');
            const score = media?.dataset?.score || '0.0';
            if (media) {
                media.innerHTML = `<span class="burger-score-badge">${score}</span>🍔`;
            }
        }

        function handleBurgerModalImageError() {
            const modalMedia = document.getElementById('modalMedia');
            if (modalMedia) {
                modalMedia.innerHTML = `<div class="modal-placeholder burger">🍔</div>`;
            }
        }

        function renderBurgerCardMedia(burger) {
            const score = formatBurgerOverallScore(burger?.overallScore || 0);
            const imageSrc = resolveBurgerImageSrc(burger);
            if (!imageSrc) {
                return `
                    <div class="burger-card-media" data-score="${score}">
                        <span class="burger-score-badge">${score}</span>
                        🍔
                    </div>
                `;
            }

            const imageAlt = escapeHtml(`${burger?.name || 'Burger'} - ${burger?.place || ''}`.trim());
            return `
                <div class="burger-card-media" data-score="${score}">
                    <span class="burger-score-badge">${score}</span>
                    <img
                        src="${escapeHtml(imageSrc)}"
                        alt="${imageAlt}"
                        class="card-image"
                        loading="lazy"
                        onerror="handleBurgerCardImageError(this)"
                    >
                </div>
            `;
        }

        function renderGrid() {
            loading.style.display = 'none';
            const items = filteredCollections[activeCollection];
            const allItems = allCollections[activeCollection];

            if (items.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                if (activeCollection === 'burgers' && allItems.length === 0) {
                    noResults.textContent = 'Todavía no hay burgers guardadas.';
                } else {
                    noResults.textContent = collectionConfig[activeCollection].empty;
                }
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            if (activeCollection === 'alfajores') {
                grid.innerHTML = items.map(alfajor => `
                    <div class="card" onclick="openModal(${encodeForInline(alfajor)}, 'alfajores')">
                        ${renderAlfajorCardMedia(alfajor)}
                        <div class="card-content">
                            <div class="card-title">${alfajor.marca} - ${alfajor.sabor}</div>
                            <div class="card-details">
                                <div class="detail-item">
                                    <span class="detail-icon">🌍</span>
                                    <span>${alfajor.pais || 'No especificado'}</span>
                                </div>
                                ${alfajor.color ? `
                                    <div class="detail-item">
                                        <span class="detail-icon">🎨</span>
                                        <span>${alfajor.color}</span>
                                    </div>
                                ` : ''}
                                ${renderAddedDateDetail(alfajor)}
                            </div>
                        </div>
                    </div>
                `).join('');
                return;
            }

            grid.innerHTML = items.map(burger => `
                <div class="card" onclick="openModal(${encodeForInline(burger)}, 'burgers')">
                    ${renderBurgerCardMedia(burger)}
                    <div class="card-content">
                        <div class="card-title">${renderBurgerPlaceLogoChip(burger.place)}${burger.name || 'Burger sin nombre'} - ${burger.place || 'Sin local'}</div>
                        <div class="card-details">
                            <div class="detail-item">
                                <span class="detail-icon">⭐</span>
                                <span>${formatBurgerOverallScore(burger.overallScore || 0)} / 10</span>
                            </div>
                            ${burger.location ? `
                                <div class="detail-item">
                                    <span class="detail-icon">📍</span>
                                    <span>${burger.location}</span>
                                </div>
                            ` : ''}
                            ${burger.meatStyle ? `
                                <div class="detail-item">
                                    <span class="detail-icon">🥩</span>
                                    <span>${burger.meatStyle}</span>
                                </div>
                            ` : ''}
                            ${burger.bunStyle ? `
                                <div class="detail-item">
                                    <span class="detail-icon">🍞</span>
                                    <span>${burger.bunStyle}</span>
                                </div>
                            ` : ''}
                            ${renderAddedDateDetail(burger)}
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function encodeForInline(item) {
            return JSON.stringify(item).replace(/"/g, '&quot;');
        }

        function openModal(item, collection = activeCollection) {
            if (collection === 'burgers') {
                openBurgerModal(item);
                return;
            }
            openAlfajorModal(item);
        }

        function resetModalScrollPosition(modal, modalContent, modalDetails, modalMedia) {
            const resetElementScroll = element => {
                if (!element) return;
                element.scrollTop = 0;
                element.scrollLeft = 0;
                if (typeof element.scrollTo === 'function') {
                    element.scrollTo(0, 0);
                }
            };

            resetElementScroll(modal);
            resetElementScroll(modalContent);
            resetElementScroll(modalDetails);
            resetElementScroll(modalMedia);
            if (typeof window.scrollTo === 'function') {
                window.scrollTo(0, 0);
            }
        }

        function openFullscreenImage(src, alt = '') {
            const fullscreenModal = document.getElementById('fullscreenImageModal');
            const fullscreenImage = document.getElementById('fullscreenImageModalImg');
            if (!fullscreenModal || !fullscreenImage || !src) return;

            if (!previousBodyOverflow) {
                previousBodyOverflow = document.body.style.overflow || '';
            }

            fullscreenImage.src = src;
            fullscreenImage.alt = alt || 'Imagen completa';
            fullscreenModal.style.display = 'flex';
            fullscreenModal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeFullscreenImage() {
            const fullscreenModal = document.getElementById('fullscreenImageModal');
            const fullscreenImage = document.getElementById('fullscreenImageModalImg');
            if (!fullscreenModal || !fullscreenImage) return;

            fullscreenModal.style.display = 'none';
            fullscreenModal.setAttribute('aria-hidden', 'true');
            fullscreenImage.src = '';
            fullscreenImage.alt = '';
            document.body.style.overflow = previousBodyOverflow;
            previousBodyOverflow = '';
        }

        function openAlfajorModal(alfajor) {
            const modal = document.getElementById('imageModal');
            const modalContent = modal.querySelector('.modal-content');
            const modalTitle = document.getElementById('modalTitle');
            const modalDetails = document.getElementById('modalDetails');
            const modalMedia = document.getElementById('modalMedia');
            const safeCountry = escapeHtml(alfajor.pais || 'No especificado');
            const safeColor = escapeHtml(alfajor.color || 'No especificado');
            const safeNotes = escapeHtml(alfajor.notas || '').replace(/\n/g, '<br>');
            const formattedDate = formatAddedDate(getItemAddedDate(alfajor));

            modalContent.classList.remove('burger-detail-modal');
            modalTitle.textContent = `${alfajor.marca} - ${alfajor.sabor}`;
            modalDetails.innerHTML = `
                <div class="modal-meta-list">
                    <span class="modal-meta-pill">🌍 ${safeCountry}</span>
                    <span class="modal-meta-pill">🎨 ${safeColor}</span>
                    ${formattedDate ? `<span class="modal-meta-pill">📅 ${escapeHtml(formattedDate)}</span>` : ''}
                </div>
                ${safeNotes ? `
                    <div class="burger-modal-card">
                        <h3>Notas</h3>
                        <p>${safeNotes}</p>
                    </div>
                ` : ''}
            `;

            const imageSrc = resolveAlfajorImageSrc(alfajor);
            if (imageSrc) {
                const imageAlt = escapeHtml(`${alfajor.marca || 'Alfajor'} - ${alfajor.sabor || ''}`.trim());
                modalMedia.innerHTML = `
                    <img
                        src="${escapeHtml(imageSrc)}"
                        alt="${imageAlt}"
                        class="modal-zoomable-image"
                        onclick="openFullscreenImage(this.src, this.alt)"
                        onerror="handleAlfajorModalImageError(this)"
                    >
                `;
            } else {
                modalMedia.innerHTML = `<div class="modal-placeholder alfajor">🍪</div>`;
            }

            modal.style.display = 'flex';
            resetModalScrollPosition(modal, modalContent, modalDetails, modalMedia);
            requestAnimationFrame(() => {
                resetModalScrollPosition(modal, modalContent, modalDetails, modalMedia);
            });
        }

        function openBurgerModal(burger) {
            const modal = document.getElementById('imageModal');
            const modalContent = modal.querySelector('.modal-content');
            const modalTitle = document.getElementById('modalTitle');
            const modalDetails = document.getElementById('modalDetails');
            const modalMedia = document.getElementById('modalMedia');

            const safeBurgerName = escapeHtml(burger.name || 'Burger sin nombre');
            const safePlace = escapeHtml(burger.place || 'Sin local');
            const safeLocation = escapeHtml(burger.location || '');
            const safeMeatStyle = escapeHtml(burger.meatStyle || '');
            const safeBunStyle = escapeHtml(burger.bunStyle || '');
            const safeToppings = escapeHtml(burger.toppings || '').replace(/\n/g, '<br>');
            const safeNotes = escapeHtml(burger.notes || '').replace(/\n/g, '<br>');
            const formattedDate = formatAddedDate(getItemAddedDate(burger));

            modalContent.classList.add('burger-detail-modal');
            const titleLogo = renderBurgerPlaceLogoWithFallback(burger.place);
            modalTitle.innerHTML = `
                <span class="modal-title-with-logo">
                    ${titleLogo}
                    <span>${safeBurgerName}</span>
                </span>
            `;

            const placeLogo = renderBurgerPlaceLogoWithFallback(burger.place);
            const metaPills = [
                `<span class="modal-meta-pill burger-modal-place-chip">${placeLogo}<span class="meta-pill-text">${safePlace}</span></span>`
            ];

            if (safeLocation) {
                metaPills.push(`<span class="modal-meta-pill"><span class="meta-pill-text">📍 ${safeLocation}</span></span>`);
            }
            if (safeMeatStyle) {
                metaPills.push(`<span class="modal-meta-pill"><span class="meta-pill-text">🥩 ${safeMeatStyle}</span></span>`);
            }
            if (safeBunStyle) {
                metaPills.push(`<span class="modal-meta-pill"><span class="meta-pill-text">🍞 ${safeBunStyle}</span></span>`);
            }
            if (formattedDate) {
                metaPills.push(`<span class="modal-meta-pill"><span class="meta-pill-text">📅 ${escapeHtml(formattedDate)}</span></span>`);
            }

            const detailRatingFields = BURGER_RATING_FIELDS;
            const metricsMarkup = detailRatingFields.map(field => {
                const value = getBurgerRatingValue(burger, field.key);
                const percentage = getBurgerMetricProgress(value, field);
                const displayValue = formatBurgerMetricValue(value);
                const scaleLabel = field.scaleLabel ?? field.max;

                return `
                    <div class="burger-metric-card">
                        <div class="burger-metric-heading">
                            <span>${field.label}</span>
                            <strong>${displayValue}/${scaleLabel}</strong>
                        </div>
                        <div class="burger-metric-track">
                            <span style="width: ${percentage}%"></span>
                        </div>
                    </div>
                `;
            }).join('');

            const commentsMarkup = detailRatingFields.map(field => {
                const rawComment = getBurgerRatingComment(burger, field.key);
                if (!rawComment || typeof rawComment !== 'string' || !rawComment.trim()) {
                    return '';
                }
                const featureScore = formatBurgerMetricValue(getBurgerRatingValue(burger, field.key));
                const scaleLabel = field.scaleLabel ?? field.max;

                return `
                    <article class="burger-comment-card">
                        <h4>${field.label} · ${featureScore}/${scaleLabel}</h4>
                        <p>${escapeHtml(rawComment).replace(/\n/g, '<br>')}</p>
                    </article>
                `;
            }).join('');

            modalDetails.innerHTML = `
                <div class="burger-modal-shell">
                    <section class="burger-modal-summary">
                        <div class="burger-score-panel">
                            <span class="burger-score-value">${formatBurgerOverallScore(burger.overallScore || 0)}</span>
                            <span class="burger-score-label">Score total / 10</span>
                        </div>
                        <div class="modal-meta-list burger-meta-grid">${metaPills.join('')}</div>
                    </section>
                    <section class="burger-metrics-grid">
                        ${metricsMarkup}
                    </section>
                ${safeToppings ? `
                    <section class="burger-modal-card">
                        <h3>Extras</h3>
                        <p>${safeToppings}</p>
                    </section>
                ` : ''}
                ${commentsMarkup ? `
                    <section class="burger-comments-grid">
                        ${commentsMarkup}
                    </section>
                ` : ''}
                ${safeNotes ? `
                    <section class="burger-modal-card">
                        <h3>Notas generales</h3>
                        <p>${safeNotes}</p>
                    </section>
                ` : ''}
                </div>
            `;

            const imageSrc = resolveBurgerImageSrc(burger);
            if (imageSrc) {
                const imageAlt = escapeHtml(`${burger?.name || 'Burger'} - ${burger?.place || ''}`.trim());
                modalMedia.innerHTML = `
                    <img
                        src="${escapeHtml(imageSrc)}"
                        alt="${imageAlt}"
                        class="modal-zoomable-image"
                        onclick="openFullscreenImage(this.src, this.alt)"
                        onerror="handleBurgerModalImageError()"
                    >
                `;
            } else {
                modalMedia.innerHTML = `<div class="modal-placeholder burger">🍔</div>`;
            }
            modal.style.display = 'flex';
            resetModalScrollPosition(modal, modalContent, modalDetails, modalMedia);
            requestAnimationFrame(() => {
                resetModalScrollPosition(modal, modalContent, modalDetails, modalMedia);
            });
        }

        function setupModal() {
            const modal = document.getElementById('imageModal');
            const closeBtn = document.querySelector('.modal-close');
            const fullscreenModal = document.getElementById('fullscreenImageModal');

            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            modal.addEventListener('click', event => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });

            document.addEventListener('keydown', event => {
                if (event.key !== 'Escape') return;

                if (fullscreenModal && fullscreenModal.style.display === 'flex') {
                    closeFullscreenImage();
                    return;
                }

                if (modal.style.display === 'flex') {
                    modal.style.display = 'none';
                }
            });
        }

        function setupFullscreenImageModal() {
            const fullscreenModal = document.getElementById('fullscreenImageModal');
            const closeBtn = document.querySelector('.fullscreen-image-close');
            if (!fullscreenModal || !closeBtn) return;

            closeBtn.addEventListener('click', closeFullscreenImage);
            fullscreenModal.addEventListener('click', event => {
                if (event.target === fullscreenModal) {
                    closeFullscreenImage();
                }
            });
        }
    </script>
</body>
</html>
